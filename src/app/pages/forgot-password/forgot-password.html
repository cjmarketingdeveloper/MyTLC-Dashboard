<div class="min-h-screen bg-white">
  <div class="grid min-h-screen lg:grid-cols-2">
    <!-- LEFT SIDE -->
    <div class="flex flex-col justify-between px-8 py-10 lg:px-20">
      <div class="mx-auto flex login-h-screen w-full max-w-md flex-col justify-center py-12">
        <!-- Mobile Illustration -->
        <div class="mb-10 flex justify-center lg:hidden">
          <img src="images/login-vector.png" alt="Login" class="w-32" />
        </div>

        <div class="mb-10">
          <h1 class="text-4xl font-bold text-[#231F20]">
            {{ step === 1 ? 'Forgot Password?' : 'Reset Password' }}
          </h1>
          <p class="mt-3 text-[#75777B]">
            {{ step === 1 ? 'Enter your email to receive a verification code.' : 'Enter the code sent to your email and your new password.' }}
          </p>
        </div>

        <!-- STEP 1: EMAIL FORM -->
        <form *ngIf="step === 1" [formGroup]="forgotForm" (ngSubmit)="onSubmitEmail()" class="space-y-6">
          <div>
            <label class="mb-2 block text-sm font-medium">Email Address</label>
            <input
              formControlName="email"
              type="email"
              placeholder="john@email.com"
              class="w-full rounded-lg border border-[#C8C8C7] px-4 py-3 outline-none transition focus:border-[#007179]" />
          </div>

          <button
            type="submit"
            [disabled]="forgotForm.invalid || isProcessing"
            class="w-full rounded-lg bg-[#FF8200] py-3 font-semibold text-white transition hover:opacity-90 disabled:opacity-50">
            <span *ngIf="isProcessing" class="mr-2 inline-block h-5 w-5 animate-spin rounded-full border-b-2 border-white"></span>
            <span>{{ isProcessing ? 'Sending Code...' : 'Send Reset Code' }}</span>
          </button>
        </form>

        <!-- STEP 2: CODE & PASSWORD FORM -->
        <form *ngIf="step === 2" [formGroup]="resetForm" (ngSubmit)="onSubmitReset()" class="space-y-5">
          <!-- Verification Code -->
          <div>
            <label class="mb-2 block text-sm font-medium">Verification Code</label>
            <input
              formControlName="code"
              type="text"
              placeholder="Enter 6-digit code"
              class="w-full rounded-lg border border-[#C8C8C7] px-4 py-3 outline-none transition focus:border-[#007179]" />
          </div>

          <!-- New Password -->
          <div>
            <label class="mb-2 block text-sm font-medium">New Password</label>
            <input
              formControlName="password"
              type="password"
              placeholder="••••••••"
              class="w-full rounded-lg border border-[#C8C8C7] px-4 py-3 outline-none transition focus:border-[#007179]" />
          </div>

          <!-- Confirm Password -->
          <div>
            <label class="mb-2 block text-sm font-medium">Confirm Password</label>
            <input
              formControlName="confirmPassword"
              type="password"
              placeholder="••••••••"
              class="w-full rounded-lg border border-[#C8C8C7] px-4 py-3 outline-none transition focus:border-[#007179]" />
            <p *ngIf="resetForm.hasError('passwordMismatch') && resetForm.get('confirmPassword')?.touched" class="mt-1 text-xs text-red-500">
              Passwords do not match.
            </p>
          </div>

          <button
            type="submit"
            [disabled]="resetForm.invalid || isProcessing"
            class="w-full rounded-lg bg-[#FF8200] py-3 font-semibold text-white transition hover:opacity-90 disabled:opacity-50">
            <span *ngIf="isProcessing" class="mr-2 inline-block h-5 w-5 animate-spin rounded-full border-b-2 border-white"></span>
            <span>{{ isProcessing ? 'Resetting Password...' : 'Reset Password' }}</span>
          </button>

          <!-- Option to Resend Code -->
          <div class="flex justify-between text-xs text-gray-500">
            <button type="button" (click)="onResendCode()" class="text-[#007179] hover:underline">
              Didn't receive a code? Resend
            </button>
            <button type="button" (click)="step = 1" class="hover:underline">
              Change email
            </button>
          </div>
        </form>

        <a routerLink="/login" class="mt-6 text-sm text-[#007179] hover:underline">
          Want to login?
        </a>
      </div>

      <!-- Logo -->
      <div class="mt-16 flex justify-center lg:justify-start">
        <img src="images/logo.png" class="h-12" alt="Logo" />
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div
      class="hidden h-screen w-full bg-cover bg-center bg-no-repeat lg:block"
      style="background-image: url('images/forg-back.jpg');"></div>
  </div>
</div>
