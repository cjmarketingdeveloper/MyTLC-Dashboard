<div class="space-y-6">
  <!-- Title + Slug -->
  <div>
    <label class="block text-sm font-medium">Title</label>
    <input type="text" 
           [(ngModel)]="blog.title"
           (ngModelChange)="updateSlug()"   
           class="mt-1 block w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm outline-none focus:border-[#007179] focus:ring-2 focus:ring-[#007179] transition-all" />

    <label class="block text-sm font-medium mt-4">Slug (auto)</label>
    <input type="text" [(ngModel)]="blog.slug" readonly
           class="mt-1 block w-full rounded-md border-gray-300 bg-gray-100 shadow-sm" />
  </div>

  <!-- Content + Sidebar -->
  <div class="flex gap-6">
    <!-- 70% Content -->
    <div class="w-7/12">
      <label class="block text-sm font-medium mb-2">Content</label>
      <quill-editor [(ngModel)]="blog.content" [modules]="editorModules"
                    class="border rounded-md shadow-sm  w-full"></quill-editor>
    </div>

    <!-- 30% Sidebar -->
    <div class="w-5/12 space-y-4">
      <div>
        <label class="block text-sm font-medium">Main Featured Image Upload once created</label>
      </div>

       <div>
        <label class="block text-sm font-medium">Second Featured Image Upload once created</label>
      </div>

      <div class="mt-4">
        <label class="block text-sm font-medium">Tags</label>
        <div class="flex space-x-2 mt-1">
        <input type="text"
            [(ngModel)]="newTag"
            (keyup.enter)="addTag()"
            placeholder="Type a tag and press Enter"
            class="flex-1 rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-[#007179] focus:ring-2 focus:ring-[#007179]" />
                <button type="button"
                        (click)="addTag()"
                        class="px-4 py-2 bg-[#007179] text-white rounded-md text-sm">
                Add
                </button>
        </div>

        <!-- Pills display -->
        <div class="flex flex-wrap gap-2 mt-3">
            <span *ngFor="let tag of tagArray; let i = index"
                class="inline-flex items-center px-3 py-1 rounded-full text-sm bg-gray-200 text-gray-700">
            {{ tag }}
            <button type="button"
                    (click)="removeTag(i)"
                    class="ml-2 text-gray-500 hover:text-red-600">
                ✕
            </button>
            </span>

        </div>  
      </div>
       <div class="mt-4">
            <label class="block text-sm font-medium mb-2">Publish Status</label>
            <label class="inline-flex items-center cursor-pointer">
                <input 
                type="checkbox" 
                [(ngModel)]="blog.publish" 
                class="sr-only peer"
                />
                <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#FF8200]"></div>
                <span class="ms-3 text-sm font-medium text-gray-700">
                {{ blog.publish ? 'Published' : 'Draft' }}
                </span>
            </label>
        </div>
    </div>
  </div>

  <!-- Save Button -->
  <button (click)="saveBlog()"
          class="rounded-xl bg-[#FF8200] px-6 py-3 font-semibold text-white transition hover:opacity-90">
    Publish Blog
  </button>
</div>
