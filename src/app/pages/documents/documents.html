<div class="space-y-6">
    <!-- Header -->
    <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <div>
            <h1 class="text-3xl font-bold text-[#231F20]">
                Documents
            </h1>
            <p class="mt-1 text-[#75777B]">
                Manage documents.
            </p>
        </div>

        <div class="flex flex-wrap gap-3">            
            <button
                (click)="openCreateDocumentModal()"
                class="rounded-xl bg-[#FF8200] px-6 py-3 font-semibold text-white transition hover:opacity-90">
                Create Document
            </button>
        </div>
    </div>

     <!-- Documents Table -->
    <div class="overflow-hidden rounded-2xl bg-white shadow-sm">
        <table class="min-w-full">
            <thead class="border-b bg-gray-50">
                <tr>
                    <th class="px-6 py-4 text-left">Title</th>
                    <th class="px-6 py-4 text-left">Description</th>
                    <th class="px-6 py-4 text-left">Category</th>
                    <th class="px-6 py-4 text-left">Type</th>                    
                    <th class="px-6 py-4 text-left">Size</th>
                    <th class="px-6 py-4 text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr
                    *ngFor="let doc of documents"
                    class="border-b  border-gray-300 hover:bg-gray-50">
                    <td class="px-6 py-4">
                        {{doc.title}}
                    </td>
                    <td class="px-6 py-4">
                        {{doc.description }} 
                    </td>
                    <td class="px-6 py-4">
                        {{doc.category}} 
                    </td>
                    <td class="px-6 py-4">
                        {{ doc.type }}
                    </td>
                    <td class="px-6 py-4">
                        {{ doc.size }}
                    </td>
                    <td class="px-6 py-4 text-center">                        
                        <a
                            href="{{ doc.file_path }}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="rounded-lg bg-[#FF8200] px-4 py-2 text-white">
                            Download
                        </a>

                        <button
                            (click)="copyToClipboard(doc.file_path)"
                            title="Copy URL"
                            class="mt-5 flex items-center gap-1 rounded-xl bg-green-50 px-3 py-1.5 text-xs font-medium text-green-700 border border-green-200 hover:bg-green-100"
                            >
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                            </svg>
                            <span>Copy Link</span>
                        </button>

                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<!-- Create Product -->
 <app-document-create-widget-modal
    *ngIf="showDocumentCreateModal"
    (close)="closeCreateDocumentModal()">
</app-document-create-widget-modal>
