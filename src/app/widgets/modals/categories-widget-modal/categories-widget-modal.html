<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">

    <div
    class="w-full max-w-4xl rounded-3xl bg-white shadow-2xl">
        <!-- Header -->
        <div
        class="flex items-center justify-between border-b p-6">
            <h2
            class="text-2xl font-semibold">
                Categories
            </h2>

            <button
            (click)="closeModal()"
            class="text-3xl">
                ×
            </button>
        </div>
        <!-- Body -->
                <div class="max-h-[70vh] overflow-y-auto p-6 space-y-6">

            <!-- Add Category Form -->
            <form (submit)="$event.preventDefault(); onCreateCategory()" class="flex gap-3">
            <input
                type="text"
                [ngModel]="newCategoryName()"
                (ngModelChange)="newCategoryName.set($event)"
                name="categoryName"
                placeholder="Enter category name..."
                class="flex-1 rounded-xl border border-gray-300 px-4 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all"
                required
            />
            <button
                type="submit"
                [disabled]="!newCategoryName().trim() || isLoading()"
                class="rounded-xl bg-[#FF8200] px-5 py-2.5 text-sm font-medium text-white hover:bg-[#FF8200] disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
            >
                Add Category
            </button>
            </form>

            <hr class="border-gray-100" />

            <!-- Loading State -->
            @if (isLoading()) {
            <div class="py-8 text-center text-sm text-gray-500">Loading categories...</div>
            } @else {
            <!-- List of Categories -->
            <div class="space-y-2">
                @for (category of categories(); track category.id) {
                <div class="flex items-center justify-between rounded-xl border border-gray-100 bg-gray-50/50 p-4 hover:bg-gray-50 transition-colors">
                    <span class="font-medium text-gray-700">{{ category.name }}</span>
                    <button
                    (click)="onDeleteCategory(category.id!)"
                    class="rounded-lg p-2 text-sm text-red-500 hover:bg-red-50 hover:text-red-700 transition-colors"
                    title="Delete category"
                    >
                    Delete
                    </button>
                </div>
                } @empty {
                <div class="py-8 text-center text-sm text-gray-400">
                    No categories created yet.
                </div>
                }
            </div>
            }

        </div>
    </div>
</div>
