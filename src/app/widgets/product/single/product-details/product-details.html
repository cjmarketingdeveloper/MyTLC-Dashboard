<div>
    <h3 class="text-2xl mt-4">Details</h3>
    <div class="p-4">
        <form
            (ngSubmit)="saveChanges()"
            class="space-y-8">
            <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
                <!-- Title -->
                <div class="lg:col-span-2">
                    <label class="mb-2 block font-medium text-[#231F20]">
                        Product Title
                    </label>

                    <input
                        [(ngModel)]="product().title"
                        name="title"
                        type="text"
                        class="w-full rounded-xl border border-[#C8C8C7] p-3 focus:border-[#007179] focus:outline-none">
                </div>

                <!-- Description -->
                <div class="lg:col-span-2">
                    <label class="mb-2 block font-medium">
                        Description
                    </label>
                    <textarea
                        [(ngModel)]="product().description"
                        name="description"
                        rows="5"
                        class="w-full rounded-xl border border-[#C8C8C7] p-3 focus:border-[#007179] focus:outline-none"></textarea>
                </div>

                <!-- Price -->
                <div>
                    <label class="mb-2 block font-medium">
                        Price
                    </label>
                    <input
                        [(ngModel)]="product().price"
                        name="price"
                        type="number"
                        step="0.01"
                        class="w-full rounded-xl border border-[#C8C8C7] p-3">
                </div>

                <!-- Minimum Quantity -->
                <div>
                    <label class="mb-2 block font-medium">
                        Minimum Quantity
                    </label>
                    <input
                        [(ngModel)]="product().min_quantity"
                        name="minQuantity"
                        type="number"
                        min="1"
                        class="w-full rounded-xl border border-[#C8C8C7] p-3">
                </div>

                <!-- Stock -->
                <div>
                    <label class="mb-2 block font-medium">
                        Stock Count
                    </label>
                    <input
                        [(ngModel)]="product().stock_count"
                        name="stockCount"
                        type="number"
                        min="0"
                        class="w-full rounded-xl border border-[#C8C8C7] p-3">
                </div>

                <!-- Empty column for spacing -->
                <div></div>
                <!-- Show Stock -->
                <div>
                    <label class="flex items-center gap-3">
                        <input
                            [(ngModel)]="product().show_stock"
                            name="showStock"
                            type="checkbox"
                            class="h-5 w-5 accent-[#007179]">
                        <span class="font-medium">
                            Show Stock
                        </span>
                    </label>
                </div>

                <!-- Active -->
                <div>
                    <label class="flex items-center gap-3">

                        <input
                            [(ngModel)]="product().is_active"
                            name="isActive"
                            type="checkbox"
                            class="h-5 w-5 accent-[#007179]">
                        <span class="font-medium">
                            Active Product
                        </span>
                    </label>
                </div>
            </div>

            <div class="flex justify-end border-t border-gray-500/50 pt-6">
                <button
                    type="submit"
                    [disabled]="loading"
                    class="rounded-xl bg-[#FF8200] px-8 py-3 font-semibold text-white transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50">
                    {{ loading ? 'Saving...' : 'Save Changes' }}
                </button>
            </div>
        </form>
    </div>
    
    <div class="border-t border-gray-500/50 pt-6 mb-3">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border-t pt-6 mt-6">
        <!-- Left Column: Companies -->
        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 flex flex-col justify-between">
            
            <div>
                <h2 class="prod-details-title-selected">{{ product().companyName }}</h2>
                <h3 class="font-semibold text-gray-700 mb-3 text-lg mt-4">Select Company</h3>
                
                <div class="space-y-2">
                    <label 
                    *ngFor="let company of companies" 
                    class="flex items-center space-x-3 p-2 rounded hover:bg-white cursor-pointer transition-colors"
                    >
                    <input 
                        type="radio" 
                        name="companyGroup" 
                        [value]="company.id" 
                        [(ngModel)]="tempCompanyId"
                        class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500"
                    >
                    <span class="text-gray-800">{{ company.name }}</span>
                    </label>
                </div>
            </div>

            <button 
                (click)="updateCompany()"
                [disabled]="tempCompanyId === selectedCompanyId()"
                class="mt-6 rounded-xl bg-[#FF8200] px-8 py-3 font-semibold text-white transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50"
                >
                Update Company
            </button>
        </div>

        <!-- Right Column: Categories -->
        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 flex flex-col justify-between">
            <div>
            <h2 class="prod-details-title-selected">{{ product().categoryName }}</h2>
            <h3 class="font-semibold text-gray-700 mb-3 text-lg mt-4">Select Category</h3>
            
            <div class="space-y-2">
                <label 
                *ngFor="let category of categories" 
                class="flex items-center space-x-3 p-2 rounded hover:bg-white cursor-pointer transition-colors"
                >
                <input 
                    type="radio" 
                    name="categoryGroup" 
                    [value]="category.id" 
                    [(ngModel)]="tempCategoryId"
                    class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500"
                >
                <span class="text-gray-800">{{ category.name }}</span>
                </label>
            </div>
            </div>

            <button 
                (click)="updateCategory()"
                [disabled]="tempCategoryId === selectedCategoryId()"
                class="mt-6 rounded-xl bg-[#FF8200] px-8 py-3 font-semibold text-white transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50"
                >
                Update Category
            </button>
        </div>

        </div>
    </div>
    <div class="flex justify-start pt-6 mt-2">
            <div className="p-5">
                <p>Do you want to delete this product?</p><br/>
                @if (!isConfirmingDelete) {
                    <button
                        type="button"
                        (click)="toggleDeleteConfirm()"
                        class="bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-colors focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                        Delete Product
                    </button>
                } @else {
                    <div class="flex items-center gap-2">
                        <button
                        type="button"
                        (click)="deleteCurrentProduct()"
                        [disabled]="loading"
                        class="bg-red-700 hover:bg-red-800 disabled:opacity-50 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-colors">
                         Confirm Delete
                        </button>
                        <button
                        type="button"
                        (click)="toggleDeleteConfirm()"
                        [disabled]="isLoadingDelete"
                        class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-lg font-medium transition-colors">
                            Cancel
                        </button>
                    </div>
                    }
                </div>
    </div>
</div>
