<div>
  <h3 class="text-2xl font-semibold mt-4 text-gray-800">Images</h3>
  <div class="p-4 space-y-6">

    <!-- Image Display / Preview Area -->
    <div class="flex w-full justify-center">
      <ng-container *ngIf="previewUrl() || product().imageUrl; else noImage">
        <img
          [src]="previewUrl() || product().imageUrl"
          alt="Product preview"
          class="h-64 w-64 rounded-2xl border object-cover shadow-sm"
        >
      </ng-container>
      <ng-template #noImage>
        <div class="flex h-64 w-64 items-center justify-center rounded-2xl border border-dashed border-gray-300 bg-gray-50 text-gray-400">
          No Image
        </div>
      </ng-template>
    </div>

    <!-- Drag & Drop Upload Zone -->
    <div>
      <label
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        [class.border-indigo-500]="isDragging()"
        [class.bg-indigo-50]="isDragging()"
        class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed rounded-2xl cursor-pointer border-gray-300 bg-gray-50 hover:bg-gray-100 transition-colors duration-150"
      >
        <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4">
          <svg class="w-8 h-8 mb-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
          </svg>
          <p class="mb-1 text-sm text-gray-700">
            <span class="font-semibold">Click to upload</span> or drag and drop
          </p>
          <p class="text-xs text-gray-500">PNG, JPG, or WEBP (Max 2MB)</p>
        </div>

        <input
          type="file"
          class="hidden"
          accept="image/*"
          (change)="onFileSelected($event)"
        >
      </label>
    </div>

    <!-- Upload Action Button -->
    <div class="flex justify-end">
      <button
        type="button"
        (click)="saveUploadPreview()"
        [disabled]="!selectedFile()"
        class="px-5 py-2.5 rounded-xl font-medium text-white transition-colors duration-150 disabled:opacity-50 disabled:cursor-not-allowed bg-[#FF8200] hover:bg-[#FF8200] shadow-sm"
      >
        Upload & Save
      </button>
    </div>

  </div>
</div>
